<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate OTP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f172a, #312e81, #581c87);
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .dashboard {
            width: min(100%, 520px);
            margin: 30px auto;
            padding: 32px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(15px);
        }

        .count-row, .button-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .otp-box {
            margin-top: 25px;
            padding: 28px 20px;
            border: 1px solid rgba(129, 140, 248, 0.35);
            border-radius: 18px;
            background: linear-gradient(
                135deg,
                rgba(79, 70, 229, 0.20),
                rgba(147, 51, 234, 0.15)
            );
            text-align: center;
        }

        .label {
            margin: 0 0 16px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #otp {
            margin: 0;
            min-height: 46px;
            color: #a5f3fc;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 10px;
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
        }

        .count-row {
            margin: 28px 0 12px;
            color: #cbd5e1;
            font-size: 14px;
        }

        #otpCount {
            color: #c4b5fd;
            font-weight: bold;
        }

        .progress-track {
            height: 10px;
            overflow: hidden;
            border-radius: 20px;
            background: #334155;
        }

        #progressBar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #818cf8, #c084fc, #22d3ee);
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.5);
            transition: width 0.3s ease;
        }

        .button-row {
            margin-top: 28px;
        }

        button {
            min-height: 48px;
            padding: 0 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.25);
            transition: background 0.2s ease, transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        button:not(:disabled):hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
        }

        button:disabled {
            background: #475569;
            color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        #countdown {
            margin: 0;
            color: #cbd5e1;
            font-size: 12px;
            line-height: 1.5;
            text-align: right;
        }

        #countdown.limit {
            color: #fca5a5;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .dashboard {
                margin: 10px auto;
                padding: 24px 20px;
            }

            h1 {
                font-size: 26px;
            }

            #otp {
                font-size: 32px;
                letter-spacing: 7px;
            }

            .button-row {
                align-items: stretch;
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            #countdown {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <main class="dashboard">

        <h1>OTP Generator</h1>

        <section class="otp-box" aria-label="Current one-time password">
            <p class="label">Your current OTP</p>
            <p id="otp" aria-live="polite"></p>
        </section>

        <div class="count-row">
            <span>OTPs generated</span>
            <span id="otpCount">0 / 5</span>
        </div>

        <div
            class="progress-track"
            role="progressbar"
            aria-label="OTP generation limit"
            aria-valuemin="0"
            aria-valuemax="5"
            aria-valuenow="0"
        >
            <div id="progressBar"></div>
        </div>

        <div class="button-row">
            <button id="generateButton" type="button" disabled>
                Generate another OTP
            </button>

            <p id="countdown" aria-live="polite"></p>
        </div>

    </main>

    <script>
        const otpText = document.getElementById("otp");
        const button = document.getElementById("generateButton");
        const countdown = document.getElementById("countdown");
        const otpCount = document.getElementById("otpCount");
        const progressBar = document.getElementById("progressBar");
        const progressTrack = document.querySelector(".progress-track");

        const maxOTPs = 5;
        let count = 0;

        function generateOTP() {
            if (count === maxOTPs) {
                return;
            }

            const otp = Math.floor(Math.random() * 9000) + 1000;

            count++;

            otpText.textContent = otp;
            otpCount.textContent = count + " / " + maxOTPs;
            progressBar.style.width = (count / maxOTPs * 100) + "%";
            progressTrack.setAttribute("aria-valuenow", count);

            button.disabled = true;

            if (count === maxOTPs) {
                button.textContent = "Limit reached";

                countdown.textContent =
                    "Limit reached — " + count + " of " + maxOTPs +
                    " OTPs generated.";

                countdown.classList.add("limit");
                return;
            }

            let seconds = 3;

            countdown.classList.remove("limit");
            countdown.textContent = "Next OTP available in 30 seconds.";

            const timer = setInterval(function () {
                seconds--;

                if (seconds === 0) {
                    clearInterval(timer);
                    button.disabled = false;
                    countdown.textContent =
                        "You can generate another OTP now.";
                } else {
                    countdown.textContent =
                        "Next OTP available in " + seconds + " seconds.";
                }
            }, 1000);
        }

        button.addEventListener("click", generateOTP);

        generateOTP();
    </script>

</body>
</html>
